<div class="comfort-box js-toggle-observe">
    <div class="comfort-box__details">
        <div class="comfort-box__preview">
            <img loading="lazy" decoding="async" src="{{ picture }}" alt="Picture">
        </div>
        <div class="comfort-box__info">
            <p>{{ info }}</p>
        </div>
        <h3 class="comfort-box__title">{{ title }}</h3>
    </div>
</div>
