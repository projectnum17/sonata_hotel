<section class="faq">
    <div class="container">
        <h2 class="section-title">{{ title }}</h2>
    </div>
    <div class="faq__list">
        {{#if shortList}}
            {{#each (sliceCollect faq.data 0 2)}}
                {{> _faqBox this}}
            {{/each}}
        {{else}}
            {{#each faq.data}}
                {{> _faqBox this}}
            {{/each}}
        {{/if}}
    </div>
</section>
